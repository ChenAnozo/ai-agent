spring:
  application:
    name: yu-ai-agent
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    model:
      chat: openai
      embedding: dashscope
      embedding.text: dashscope
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY}
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:deepseek-v4-flash}
  profiles:
    default: reading
server:
  port: 8123
  max-http-request-header-size: 64KB
  servlet:
    context-path: /api
logging:
  level:
    org.springframework.ai: INFO
